name: release

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CMD_PATH: .
  BINARY_NAME: github-latest
  CGO_ENABLED: 0

jobs:
  releases-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          # Builds with the go directive from go.mod so the release toolchain
          # cannot drift from the module floor.
          goversion: go.mod
          project_path: '${{ env.CMD_PATH }}'
          ldflags: -s -w
          build_flags: -a -installsuffix cgo
          binary_name: '${{ env.BINARY_NAME }}'
